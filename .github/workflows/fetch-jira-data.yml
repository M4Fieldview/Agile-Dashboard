name: Refresh Jira Data

# Fetches Jira and publishes the dashboard straight to GitHub Pages.
#
# data.json is NOT committed. It used to be, which meant every refresh added a
# ~7 KB permanent revision of a 1.25 MB file to git history — roughly 1-2 MB a
# day at a 5-minute cadence, heading for GitHub's 1 GB soft limit. Publishing
# via a Pages artifact instead means the cadence costs nothing in history.
#
# Pages must be set to Settings -> Pages -> Source: "GitHub Actions" for the
# deploy step to work.

on:
  schedule:
    - cron: '*/5 * * * *'    # Slow fallback. GitHub throttles this heavily
                             # (observed 1-10 hours), which is why the
                             # Cloudflare Worker in refresh-worker/ drives the
                             # real cadence via workflow_dispatch.
  workflow_dispatch:         # Manual trigger, and what the Worker calls.
  push:
    branches: [main]         # Any push to main redeploys. Required: with
                             # Actions-based Pages, nothing is published unless
                             # a workflow publishes it, so edits to index.html
                             # would otherwise never go live.

# cancel-in-progress: true is deliberate, and was learned the hard way.
#
# With `false`, a run wedged at the github-pages deployment gate holds this
# concurrency group forever: every later dispatch is cancelled while still
# queued, so the data silently stopped updating for six days (2026-09-04 to
# 2026-09-10) with no failed run to notice. Nothing was actually gating it --
# wait_timer 0, zero reviewers -- the run was just stuck.
#
# With `true`, the next dispatch clears a wedged run instead of being blocked
# by it, so the pipeline self-heals. The cost is that a deploy running longer
# than the dispatch interval can be cancelled part-way; runs take well under a
# minute, and the following dispatch publishes anyway. An occasional skipped
# deploy beats silently serving week-old data.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # ── Deploy rate gate ───────────────────────────────────────────────────────
  # GitHub Pages soft-limits builds to roughly 10 per hour. The Cloudflare
  # Worker fires every 5 minutes (12-13/hour), which exceeded that limit twice:
  # on 2026-09-17 and 2026-09-21 the live site froze for 8 and 13 hours while
  # every run and every github-pages deployment still reported success. Nothing
  # fails, nothing is logged, and the status page stays green — the serving
  # layer just stops applying new deployments.
  #
  # The limit is enforced HERE rather than in the Worker's cron schedule on
  # purpose: this file is version-controlled and reviewable, so the protection
  # cannot drift when somebody edits a schedule in a Cloudflare dashboard.
  # Dispatch as often as you like; at most one deploy every ~14 minutes
  # actually happens.
  #
  # It is a separate job so that skipping publishes nothing at all: the
  # `environment:` key on the deploy job registers a github-pages deployment
  # even when every step inside it is skipped.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      deploy: ${{ steps.check.outputs.deploy }}
    steps:
      - name: Has the live site been rebuilt recently?
        id: check
        env:
          LIVE_URL: https://m4fieldview.github.io/Agile-Dashboard/data.json
          MIN_SECONDS: '840'          # 14 min -> at most ~4 deploys/hour
          EVENT: ${{ github.event_name }}
        run: |
          set -uo pipefail

          # Pushes carry code changes and manual runs have a person waiting on
          # them; neither should be silently rate-limited.
          if [ "$EVENT" = "push" ]; then
            echo "push event - deploying"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          HEADERS=$(curl -sS -I --max-time 30 "$LIVE_URL" || true)
          LM=$(printf '%s' "$HEADERS" | grep -i '^last-modified:' | head -1 | cut -d: -f2- | sed 's/^ *//; s/[[:space:]]*$//')

          # Fail open: if the live site cannot be read, publishing is the safer
          # outcome. A broken check must never be able to stall the pipeline.
          if [ -z "$LM" ]; then
            echo "no Last-Modified from the live site - deploying (fail open)"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LIVE_EPOCH=$(date -u -d "$LM" +%s 2>/dev/null || true)
          if [ -z "$LIVE_EPOCH" ]; then
            echo "could not parse Last-Modified ($LM) - deploying (fail open)"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          AGE=$(( $(date -u +%s) - LIVE_EPOCH ))
          echo "live build is ${AGE}s old, threshold is ${MIN_SECONDS}s"

          if [ "$AGE" -ge "$MIN_SECONDS" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "too soon - skipping to stay under the Pages build limit"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

  refresh:
    needs: gate
    if: needs.gate.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10      # fail loudly instead of occupying the group for hours

    permissions:
      contents: read         # was write, for the commit that no longer happens
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Jira data
        env:
          JIRA_URL:   ${{ secrets.JIRA_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
        run: python3 .github/scripts/fetch_jira.py

      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp data.json  _site/
          ls -lh _site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
