name: Refresh Jira Data

# Fetches Jira and publishes the dashboard straight to GitHub Pages.
#
# data.json is NOT committed. It used to be, which meant every refresh added a
# ~7 KB permanent revision of a 1.25 MB file to git history — roughly 1-2 MB a
# day at a 5-minute cadence, heading for GitHub's 1 GB soft limit. Publishing
# via a Pages artifact instead means the cadence costs nothing in history.
#
# Pages must be set to Settings -> Pages -> Source: "GitHub Actions" for the
# deploy step to work.

on:
  schedule:
    - cron: '*/5 * * * *'    # Slow fallback. GitHub throttles this heavily
                             # (observed 1-10 hours), which is why the
                             # Cloudflare Worker in refresh-worker/ drives the
                             # real cadence via workflow_dispatch.
  workflow_dispatch:         # Manual trigger, and what the Worker calls.
  push:
    branches: [main]         # Any push to main redeploys. Required: with
                             # Actions-based Pages, nothing is published unless
                             # a workflow publishes it, so edits to index.html
                             # would otherwise never go live.

# Let a deployment finish rather than cancelling it part-way. Runs take well
# under a minute, so a 5-minute cadence never builds a backlog.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    permissions:
      contents: read         # was write, for the commit that no longer happens
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Jira data
        env:
          JIRA_URL:   ${{ secrets.JIRA_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
        run: python3 .github/scripts/fetch_jira.py

      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp data.json  _site/
          ls -lh _site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
